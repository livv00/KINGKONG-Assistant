<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>连接控台</title>
<style>
  /* 主题默认值 */
  :root {
    --body: #1a1a1a; --container: #2a2a2a; --header: #3a3a3a; --accent: #ff6b6b;
    --text: #ffffff; --textSecondary: #aaaaaa;
    --card: #3a3a3a; --cardHover: #5a5a5a;
    --input: #4a4a4a; --button: #4a4a4a; --buttonHover: #5a5a5a; --border: #4a4a4a;
    --success: #2ecc71; --warning: #ffaa00; --danger: #e74c3c; --info: #3498db;
    /* 播放状态色（参考音乐按钮）
     停止状态用主题色背景（--accent），字体用高对比深色，确保可读性 */
  --playing: #2e7d32; --playingText: #ffffff;
  --paused: #e65100; --pausedText: #ffffff;
  --stopped: var(--accent); --stoppedText: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--body); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    font-size: 13px; overflow: hidden; user-select: none;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* 无边框标题栏 */
  .titlebar {
    flex: 0 0 42px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px 0 16px; background: var(--header); border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  .titlebar .title { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #888; box-shadow: 0 0 0 2px rgba(255,255,255,0.05); }
  .status-dot.on { background: var(--success); box-shadow: 0 0 0 2px rgba(46,204,113,0.18), 0 0 10px var(--success); }
  .status-dot.err { background: var(--danger); box-shadow: 0 0 0 2px rgba(231,76,60,0.18); }
  .win-ctrls { display: flex; gap: 4px; -webkit-app-region: no-drag; }
  .win-ctrls button { width: 36px; height: 28px; border: none; border-radius: 4px; cursor: pointer; background: transparent; color: var(--text); font-size: 14px; transition: background 0.15s; }
  .win-ctrls button:hover { background: var(--buttonHover); }
  .win-ctrls button.close:hover { background: var(--danger); color: #fff; }

  /* 顶部连接条 */
  .conn-bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--container); border-bottom: 1px solid var(--border);
  }
  .conn-bar .lb { font-size: 12px; color: var(--textSecondary); white-space: nowrap; }
  .conn-bar input {
    flex: 1; min-width: 100px; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 5px; background: var(--input); color: var(--text); font-size: 13px; outline: none;
  }
  .conn-bar input:focus { border-color: var(--accent); }
  .conn-bar .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; white-space: nowrap; }
  .conn-bar .pill.green { background: rgba(46,204,113,0.15); color: var(--success); border: 1px solid rgba(46,204,113,0.3); }
  .conn-bar .pill.gray { background: rgba(170,170,170,0.15); color: var(--textSecondary); border: 1px solid rgba(170,170,170,0.3); }
  .conn-bar .pill.red { background: rgba(231,76,60,0.15); color: var(--danger); border: 1px solid rgba(231,76,60,0.3); }
  .conn-bar .sc-toggle-wrap { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; cursor: pointer; user-select: none; }
  .conn-bar .sc-toggle-wrap input { width: 14px; height: 14px; cursor: pointer; margin: 0; }
  .conn-bar .sc-toggle-label { color: var(--textSecondary); }
  .conn-bar .sc-toggle-status { font-weight: bold; font-size: 11px; }
  .conn-bar .sc-toggle-status.on { color: var(--success, #2ecc71); }
  .conn-bar .sc-toggle-status.off { color: var(--textSecondary, #aaa); }

  /* AI触发配置弹窗 */
  .at-section { margin-bottom: 14px; }
  .at-label { font-size: 13px; font-weight: bold; color: var(--text); margin-bottom: 6px; display: block; }
  .at-desc { font-size: 11px; color: var(--textSecondary); margin-bottom: 6px; }
  .at-select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--input); color: var(--text); font-size: 13px; }
  .at-pool { max-height: 280px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
  .at-pool-item { display: flex; align-items: center; gap: 6px; padding: 4px 6px; font-size: 12px; border-radius: 4px; cursor: pointer; }
  .at-pool-item:hover { background: var(--buttonHover); }
  .at-pool-item input { width: 14px; height: 14px; cursor: pointer; margin: 0; }
  .at-pool-empty { color: var(--textSecondary); font-size: 12px; padding: 12px; text-align: center; }

  .btn { padding: 6px 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; transition: filter 0.15s, opacity 0.15s; }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { filter: brightness(0.92); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-default { background: var(--button); color: var(--text); }
  .btn-default:hover { background: var(--buttonHover); }

  /* 滚动内容区 */
  .scroll { flex: 1 1 auto; overflow: auto; padding: 14px 16px 20px; }
  .scroll::-webkit-scrollbar { width: 10px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: var(--buttonHover); }

  /* 分类区域（带边框圈起来，不折叠） */
  .cat-group {
    background: var(--container); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    user-select: none;
  }
  .cat-group.collapsed .cat-body { display: none; }
  .cat-group.dragging { opacity: 0.4; transform: scale(0.98); }
  .cat-group.drag-over {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,107,107,0.25);
  }
  .cat-group.drag-over-top {
    border-top: 3px solid var(--accent);
  }
  .cat-group.drag-over-bottom {
    border-bottom: 3px solid var(--accent);
  }
  .cat-head {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    background: var(--header); border-bottom: 1px solid var(--border);
    cursor: grab;
  }
  .cat-head:active { cursor: grabbing; }
  .cat-head .arrow {
    width: 0; height: 0; display: inline-block;
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid var(--textSecondary);
    transition: transform 0.2s;
  }
  .cat-group.collapsed .arrow { transform: rotate(-90deg); }
  .cat-head .cname { flex: 1; font-size: 12px; font-weight: bold; color: var(--text); }
  .cat-head .ctype { font-size: 10px; color: var(--textSecondary); padding: 1px 6px; border-radius: 8px; background: var(--input); }
  .cat-head .ccount { font-size: 10px; color: var(--accent); padding: 1px 8px; border-radius: 8px; background: rgba(255,107,107,0.12); font-weight: bold; }
  .cat-head .ccount.zero { color: var(--textSecondary); background: var(--input); }
  .cat-head .drag-handle {
    color: var(--textSecondary); font-size: 14px; line-height: 1; padding: 0 2px; cursor: grab;
    display: inline-flex; align-items: center;
  }
  .cat-body { padding: 8px; }

  /* 节目项方块网格 */
  .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  .item-grid.fader-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }

  /* 普通节目项方块（和字体差不多大） */
  .item-block {
    position: relative; padding: 5px 6px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card);
    transition: transform 0.1s, box-shadow 0.15s;
    display: flex; align-items: center; justify-content: center;
    min-height: 28px; text-align: center;
  }
  .item-block:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
  .item-block.active { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(255,107,107,0.3); }
  .item-block .ib-name { font-size: 12px; font-weight: bold; word-break: break-all; line-height: 1.2; }
  /* 播放状态颜色 */
  .item-block.s0 { background: var(--stopped); border-color: var(--stopped); color: var(--stoppedText); }
  .item-block.s1 { background: var(--playing); border-color: var(--playing); color: var(--playingText); }
  .item-block.s2 { background: var(--paused); border-color: var(--paused); color: var(--pausedText); }

  /* 空分类提示 */
  .cat-empty { color: var(--textSecondary); font-size: 11px; padding: 6px 4px; text-align: center; }

  /* 推杆方块（缩窄宽度，两列布局：左名称，右垂直推满→推杆→数值→归零） */
  .fader-block {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 4px; display: flex; align-items: stretch; gap: 3px;
    transition: border-color 0.15s;
    height: 210px; /* 高度保持不变 */
    width: 86px;  /* 整体宽度明显缩短 */
    box-sizing: border-box;
    overflow: hidden; /* 防止任何子元素超出块框视觉 */
  }
  .fader-block.active { border-color: var(--accent); }
  /* 左列：名称（每个字正立横写，整列从上到下逐字排列） */
  .fader-block .fb-name {
    font-size: 11px; font-weight: bold; line-height: 1.3;
    letter-spacing: 0;
    color: var(--text); text-align: center;
    display: flex; flex-direction: column; align-items: center;
    flex: 0 0 auto;
    width: 22px;
    padding: 4px 2px 4px 0;
    margin-right: 2px;
    border-right: 1px solid var(--border);
    overflow: hidden;
    max-height: 100%;
    box-sizing: border-box;
    user-select: none;
    align-self: stretch;
    word-break: break-all;
  }
  .fader-block .fb-name .idx { font-size: 9px; color: var(--textSecondary); margin-bottom: 2px; }
  .fader-block .fb-name .nc { display: block; line-height: 1.25; }
  /* 右列：推满按钮 → 推杆 → 数值 → 归零（垂直叠放） */
  .fader-block .fb-col {
    flex: 1;
    min-width: 0;
    display: flex; flex-direction: column; align-items: stretch; justify-content: space-between;
    gap: 3px;
    padding: 1px 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  .fader-block .fb-col .b-full,
  .fader-block .fb-col .b-zero {
    box-sizing: border-box;
    width: 100%; max-width: 100%;
    padding: 2px 0;
    font-size: 10px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    transition: filter 0.15s;
    text-align: center;
    white-space: nowrap;
    line-height: 1.2;
  }
  .fader-block .fb-col .b-full:hover { filter: brightness(1.12); }
  .fader-block .fb-col .b-zero:hover { filter: brightness(1.12); }
  .fader-block .fb-col .b-full { background: var(--success); color: #fff; }
  .fader-block .fb-col .b-zero { background: var(--danger); color: #fff; }
  .fader-block .fb-col .fb-val {
    box-sizing: border-box;
    width: 100%; max-width: 100%;
    font-size: 10px; color: var(--accent); font-weight: bold; text-align: center;
    background: var(--input); border-radius: 4px;
    padding: 2px 0;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
  }
  /* 推杆容器：严格限制在右列宽度内，旋转后也不会视觉溢出 */
  .fader-block .fb-slider-wrap {
    box-sizing: border-box;
    width: 100%;
    height: 128px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;      /* 关键：超出就裁掉，不出现滑块阴影/边缘外溢 */
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%);
  }
  /* 推杆滑块：使用 rotate(-90deg) 方式将横向 range 转为垂直，保证 value=0（下）→ value=255（上）一致且不跳 */
  .fader-vslider {
    -webkit-appearance: none; appearance: none;
    width: 126px; height: 20px; background: transparent; outline: none;
    transform: rotate(-90deg);
    transform-origin: center;
    padding: 0; margin: 0;
    box-sizing: border-box;
  }
  .fader-vslider::-webkit-slider-runnable-track {
    width: 100%; height: 6px;
    background: var(--input); border-radius: 3px;
  }
  .fader-vslider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 16px; border-radius: 3px;
    background: var(--accent);
    margin-top: -5px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
    cursor: pointer;
    transition: background 0.1s;
  }
  .fader-vslider::-webkit-slider-thumb:hover { filter: brightness(1.1); }
  .fader-vslider::-moz-range-track { width:100%; height:6px; background:var(--input); border-radius:3px; }
  .fader-vslider::-moz-range-thumb { width:13px; height:16px; border-radius:3px; background:var(--accent); border:none; cursor:pointer; }

  /* 自动刷新微闪效果（极淡） */
  @keyframes refresh-flash {
    0% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
    30% { box-shadow: inset 0 0 30px 0 rgba(255,255,255,0.04); }
    100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
  }
  .refreshing .cat-group { animation: refresh-flash 0.6s ease-out; }

  /* 正在播放区域（置顶固定，不随滚动） */
  #playingSection {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    background: var(--container);
  }
  .playing-section { overflow: hidden; display: flex; flex-direction: column; }
  .playing-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: var(--header); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .playing-head .ph-title { font-size: 13px; font-weight: bold; color: var(--accent); margin-right: 4px; }
  .playing-head .spacer { flex: 1; }
  .playing-head .ph-count { font-size: 10px; color: var(--success); padding: 1px 8px; border-radius: 8px; background: rgba(46,204,113,0.12); font-weight: bold; }
  .playing-head .ph-count.zero { color: var(--textSecondary); background: var(--input); }

  /* 头部操作按钮：互斥保护 / 场景互斥 / 一键关闭 */
  .ph-actions { display: flex; align-items: center; gap: 6px; }
  .ph-btn {
    padding: 4px 10px; font-size: 11px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--button); color: var(--text); cursor: pointer; font-weight: bold;
    transition: filter 0.15s, background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .ph-btn:hover { filter: brightness(1.12); background: var(--buttonHover); }
  .ph-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 场景互斥激活：按钮闪烁（一直闪，不停止） */
  @keyframes mutex-blink {
    0%, 100% { background: var(--success); border-color: var(--success); color: #fff; box-shadow: 0 0 0 0 rgba(46,204,113,0.4); }
    50%      { background: #27ae60; border-color: #27ae60; color: #fff; box-shadow: 0 0 8px 2px rgba(46,204,113,0.6); }
  }
  .ph-btn.btn-mutex.on {
    animation: mutex-blink 1s ease-in-out infinite;
  }

  /* 一键关闭 */
  .ph-btn.btn-stopall { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* 正在播放内容体：3行高度，按钮网格，超出滚动 */
  .playing-body-wrap {
    flex: 0 0 auto;
    max-height: calc(28px * 3 + 10px * 2 + 6px * 2); /* 3行（28方块+6间隙） + 内边距10*2 */
    overflow: auto;
    padding: 10px;
  }
  .playing-body-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
  .playing-body-wrap::-webkit-scrollbar-track { background: transparent; }
  .playing-body-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .playing-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 6px;
  }
  .playing-empty { color: var(--textSecondary); font-size: 11px; padding: 6px 4px; text-align: center; }

  /* 正在播放按钮（方块风格，非列表） */
  .playing-btn {
    position: relative;
    padding: 6px 8px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--playing);
    background: var(--playing); color: var(--playingText);
    display: flex; align-items: center; gap: 6px;
    transition: filter 0.15s, transform 0.1s;
    min-height: 28px;
    text-align: left;
  }
  .playing-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .playing-btn.paused {
    background: var(--paused); border-color: var(--paused); color: var(--pausedText);
  }
  .playing-btn.protected::before {
    content: "🛡";
    position: absolute;
    top: 2px;
    right: 2px;
    font-size: 9px;
    line-height: 1;
    opacity: 0.85;
  }
  .playing-btn .pb-cat {
    flex: 0 0 auto; font-size: 9px; padding: 1px 4px; border-radius: 4px;
    background: rgba(0,0,0,0.22); font-weight: bold; white-space: nowrap;
  }
  .playing-btn .pb-name {
    flex: 1; font-size: 11px; font-weight: bold;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .playing-btn .pb-close {
    flex: 0 0 auto; font-size: 14px; font-weight: bold; opacity: 0.85; line-height: 1;
    padding: 0 2px;
  }
  .playing-btn .pb-close:hover { color: #ffecec; opacity: 1; }

  /* 快捷键设置弹窗 */
  .sc-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: center; justify-content: center; }
  .sc-modal { width: 90%; max-width: 820px; height: 80vh; background: var(--container); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .sc-mh { padding: 12px 16px; background: var(--header); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .sc-mh .title { font-size: 14px; font-weight: bold; color: var(--text); }
  .sc-mh .tips { font-size: 11px; color: var(--textSecondary); }
  .sc-mh .close { width: 30px; height: 26px; border: none; border-radius: 4px; cursor: pointer; background: transparent; color: var(--text); }
  .sc-mh .close:hover { background: var(--buttonHover); }
  .sc-mb { flex: 1; overflow: auto; padding: 12px 16px; }
  .sc-mb::-webkit-scrollbar { width: 10px; }
  .sc-mb::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .sc-mf { padding: 10px 16px; border-top: 1px solid var(--border); background: var(--header); display: flex; justify-content: flex-end; gap: 8px; }
  .sc-mf .btn { padding: 7px 18px; }

  /* 分类分组 */
  .sc-group { background: var(--card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
  .sc-gh { padding: 7px 12px; background: var(--header); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .sc-gh .n { flex: 1; font-size: 12px; font-weight: bold; color: var(--accent); }
  .sc-gh .c { font-size: 10px; color: var(--textSecondary); padding: 1px 6px; border-radius: 8px; background: var(--input); }

  /* 工具栏（开关） */
  .sc-toolbar { padding: 8px 16px; background: var(--card); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sc-toolbar .sync-sw { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text); cursor: pointer; user-select: none; }
  .sc-toolbar .sync-sw input[type="checkbox"] { accent-color: var(--accent); transform: scale(1.05); }
  .sc-toolbar .spacer { flex: 1; min-width: 8px; }
  .sc-toolbar .tips-2 { font-size: 11px; color: var(--textSecondary); }
  .sc-toolbar .sc-search { padding: 5px 10px; border: 1px solid var(--border, #4a4a4a); border-radius: 4px; background: var(--input, #2a2a2a); color: var(--text, #fff); font-size: 12px; min-width: 200px; outline: none; }
  .sc-toolbar .sc-search:focus { border-color: var(--accent, #ff6b6b); }
  .sc-toolbar .sc-search::placeholder { color: var(--textSecondary, #888); }
  .sc-group.sc-group-hidden { display: none; }
  .sc-row.sc-row-hidden { display: none; }
  .sc-no-result { color: var(--textSecondary, #888); text-align: center; padding: 30px; font-size: 13px; }

  /* 快捷键行：序号 | 名称 | 按键捕获按钮 | 颜色选择 | 绑定音乐 | 清除按钮 */

  <script>
    (function () {
      function applyLang(code) {
        try { localStorage.setItem('appLanguage', code || 'zh-CN'); } catch (_) {}
        try {
          if (window.I18N && typeof window.I18N.changeLanguage === 'function') {
            window.I18N.changeLanguage(code || 'zh-CN');
            // 子窗口启动翻译完成后立即关闭 MutationObserver，避免运行时开销
            // （ARTNET 触发等窗口的 UDP 数据频繁修改 textContent 会触发 mutation，关闭后无此开销）
            // 主窗口不调此函数，保留其 observer 用于自动翻译右键菜单等动态内容
            if (typeof window.I18N.shutdownObserver === 'function') window.I18N.shutdownObserver();
          }
        } catch (_) {}
      }
      try {
        const saved = localStorage.getItem('appLanguage') || 'zh-CN';
        if (saved !== 'zh-CN') {
          if (document.body) applyLang(saved);
          else window.addEventListener('DOMContentLoaded', function () { applyLang(saved); });
        }
      } catch (_) {}
      try {
        require('electron').ipcRenderer.on('language-data', function (event, langCode) {
          if (document.body) applyLang(langCode);
          else window.addEventListener('DOMContentLoaded', function () { applyLang(langCode); });
        });
      } catch (_) {}
    })();
  </script>

<script>
(function(){
  function showErrBanner(type, msg, stack){
    try{
      var txt = '[' + type + '] ' + (msg || '未知错误');
      if(stack) txt += '\n' + stack.toString().slice(0, 1500);
      var b = document.createElement('div');
      b.style.cssText = 'position:sticky;top:0;left:0;right:0;z-index:999999;padding:10px 14px;font-size:13px;font-weight:700;color:#7f1d1d;background:#fee2e2;border-bottom:2px solid #fca5a5;white-space:pre-wrap;word-break:break-all;font-family:monospace;';
      b.textContent = txt;
      if(document.body) document.body.insertBefore(b, document.body.firstChild);
      else document.documentElement.appendChild(b);
    }catch(_){ try{ alert('['+type+'] ' + msg); }catch(__){} }
  }
  window.addEventListener('error', function(e){
    showErrBanner('window.error', (e.message||''), (e.error && e.error.stack || e.error || ''));
  });
  window.addEventListener('unhandledrejection', function(e){
    showErrBanner('Promise未捕获', (e.reason && e.reason.message || e.reason || ''));
  });
})();
</script>

  function packMessage(msgNum, bodyObj) {
    const bodyStr = JSON.stringify(bodyObj || {});
    const bodyBuf = Buffer.from(bodyStr, 'utf-8');
    const header = Buffer.alloc(16);
    header[0] = 0xFA; header[1] = 0xFB; header[2] = 0xFC; header[3] = 0xFD; // startCode
    header[4] = 0x01; // version
    header[5] = 0x00; // reserved
    header.writeUInt16BE(seqNum++, 6); // seqNum
    header.writeInt16BE(msgNum, 8);     // msgNum (有符号)
    header[10] = 0x00; // respone: 0x00=请求/主动发起
    header[11] = 0x01; // dataType: 0x01=json
    header.writeUInt32BE(bodyBuf.length, 12); // msgBodyLen
    return Buffer.concat([header, bodyBuf]);

  // 协议解析安全阈值（防路由器下分片/坏包/粘包导致 recvBuf 无限涨 + CPU 100% 卡死界面）
  const MAX_BODY_LEN = 200 * 1024;       // 单条消息 body 最大 200KB（控台 JSON 一般不超过几十 KB）
  const MAX_RECVBUF_LEN = 2 * 1024 * 1024; // recvBuf 超过 2MB 直接重置（说明解析异常）
  const MAX_PARSE_ITERS = 2000;            // 每条解析链路最多 2000 次；超过就直接清空（防 JS 循环慢）
  const MAX_GARBAGE_BYTES = 2 * 1024;      // 连续找不到 startCode ≥2KB → 判定路由器拼错脏数据，全丢
  const _START_BUF = Buffer.from(START_CODE);
  let _protoNoticeTimer = null;
  function showProtoNotice(text, type, seconds){

      const box = document.getElementById('protoToast');
      if (!box) return;
      type = type || 'warn';
      seconds = seconds || 8;
      if (type === 'warn') { box.style.background = '#fff3cd'; box.style.color = '#664d03'; box.style.borderBottomColor = '#ffecb5'; }
      else if (type === 'err') { box.style.background = '#f8d7da'; box.style.color = '#842029'; box.style.borderBottomColor = '#f5c2c7'; }
      else { box.style.background = '#cff4fc'; box.style.color = '#055160'; box.style.borderBottomColor = '#b6effb'; }

  }

  // 从接收缓冲区解析消息（16字节头部）——路由器稳定性 v2：用 Buffer.indexOf 原生搜索 + 大块垃圾直接截掉
  function tryParseMessages() {
    // ① 全局上限：累积缓冲超过 2MB 直接清空 —— 加路由器后 MTU 变小，分片错位会把包切成两半混着垃圾
    if (recvBuf.length > MAX_RECVBUF_LEN) {
      try { console.warn('recvBuf oversize:', recvBuf.length, 'reset buffer'); } catch(_) {}
      showProtoNotice('已接收 ' + Math.round(recvBuf.length/1024) + 'KB 异常数据并自动重置（网络分包错位）', 'err', 10);
      recvBuf = Buffer.alloc(0);
      return [];
    }
    const msgs = [];
    let off = 0;
    let iters = 0;
    let lastHitStart = 0;
    while (true) {
      iters++;
      if (iters > MAX_PARSE_ITERS) {
        try { console.warn('tryParseMessages MAX_PARSE_ITERS hit, off=', off); } catch(_) {}
        showProtoNotice('协议解析异常：重试次数超限，已丢弃一段缓冲（建议点断开再连接）', 'err', 10);
        recvBuf = Buffer.alloc(0);
        return msgs;
      }
      if (recvBuf.length - off < 16) break; // 剩余不够一个固定头：退出等下一次 data
      if (off - lastHitStart > MAX_GARBAGE_BYTES) {
        try { console.warn('protocol garbage >=', (off-lastHitStart), 'bytes, truncate'); } catch(_) {}
        showProtoNotice('丢弃 ' + Math.round((off-lastHitStart)/1024) + 'KB 脏数据（非控台协议内容）', 'warn', 8);
        recvBuf = recvBuf.slice(off);
        return msgs;
      }
      const idx = recvBuf.indexOf(_START_BUF, off);
      if (idx === -1) {
        // 整个剩下的缓冲里都找不到 startCode：保留尾 3 字节（FD 前 3 字节可能已到，最后 1 字节还在下一段）
        const keepTail = Math.min(3, recvBuf.length);
        // 诊断用：把缓冲前 12 字节打印给用户看（开了 toLocaleString 的）
        const preview = recvBuf.length >= 12 ? recvBuf.slice(0,12) : recvBuf;
        const hexPreview = preview.toString('hex').match(/.{1,2}/g).join(' ');
        try { console.warn('startCode not found in whole buf (' + recvBuf.length + 'B), previewBytes=' + hexPreview + ', keep last', keepTail, 'bytes'); } catch(_) {}
        showProtoNotice('未找到控台帧头（收到 ' + recvBuf.length + 'B，前 12 字节：' + hexPreview + '）。若多次出现：请先断开→再连接，或确认控台 IP/端口是否对。', 'warn', 10);
        recvBuf = keepTail > 0 ? recvBuf.slice(recvBuf.length - keepTail) : Buffer.alloc(0);
        return msgs;
      }
      if (idx !== off) off = idx; // 跳过中间一段脏字节，直接落到帧头
      lastHitStart = off;
      if (recvBuf.length - off < 16) break; // 不够头，退出等下一次 data
      const sn = recvBuf.readUInt16BE(off + 6);
      const msgNum = recvBuf.readInt16BE(off + 8);
      const resp = recvBuf[off + 10];
      const dataType = recvBuf[off + 11];
      const bodyLen = recvBuf.readUInt32BE(off + 12);

      // ② bodyLen 校验：0 <= bodyLen <= MAX_BODY_LEN
      if (bodyLen < 0 || bodyLen > MAX_BODY_LEN) {
        // 读到几 MB 垃圾值 → 帧头被错位命中（纯巧合），前进 1 字节重搜下一个 startCode
        try { console.warn('bad bodyLen:', bodyLen, 'msgNum:', msgNum, 'skip from', off); } catch(_) {}
        off += 1;
        continue;
      }
      if (recvBuf.length - off < 16 + bodyLen) {
        // 包还没收齐：跳出，等下一次 data
        break;
      }
      const bodyBuf = recvBuf.slice(off + 16, off + 16 + bodyLen);
      let body = {};
      try { body = JSON.parse(bodyBuf.toString('utf-8')); } catch(e) {
        // JSON 解析失败：帧头被错位命中或 body 被破坏，前进 1 字节重搜下一个 startCode
        try { console.warn('JSON parse fail, msgNum:', msgNum, 'len:', bodyLen); } catch(_) {}
        off += 1;
        continue;
      }
      msgs.push({ msgNum, seqNum: sn, respone: resp, dataType, body, _bodyLen: bodyLen });
      off += 16 + bodyLen;
    }
    // ③ 截断缓冲：off>0 就把前面消费掉/无效字节切掉
    if (off > 0) recvBuf = recvBuf.slice(off);
    if (msgs.length > 0) {

        console.log('[PARSE OK] this batch ' + msgs.length + ' msgs: ' + sample);
      } catch(_) {}
    }
    return msgs;
  }

    } catch(e) {
      return false;
    }

  // 从控台返回对象里（可能在 body/body.data/body.result 中）找出播放列表数组（兼容所有常见命名）
  function pickPlaylistArray(obj){

    const candidates = ['playLists','playlists','playlist','lists','list','items','data','result'];

  function handleMessage(msg) {

          // （有些控台返回 200、有些返回 0，还有些直接是数组不包 status，我们全都接受避免"连上但空白"）
          const list1 = pickPlaylistArray(body);           // 顶层找

          let rendered = false;
          try {
            renderPlaylists();

            }

          setTimeout(() => { try { registerAllShortcutsToMain(); } catch(_) {} }, 200);

          setTimeout(function(){ try { if (typeof normalizeAiTriggerAfterPlaylistLoad === 'function') normalizeAiTriggerAfterPlaylistLoad(); } catch(_){} }, 300);
        }
        break;

      case MSG_PLAY_CTRL: // 1004 - 播控响应/状态同步
        // 设备主动推送的状态同步
        if (body.playId !== undefined || body.controlType !== undefined) {

          if (body.controlType === 7 || body.controlType === 8) {

        break;

      default:

    }
