  // 注意：IIFE 内部声明的函数 onclick 找不到，所以全部挂到 window 上
  window.aiTriggerConfig = { enabled: false, switchMode: 'paragraph', playIds: [] };

  window.loadAiTriggerConfig = function loadAiTriggerConfig() {

        if (Array.isArray(p.playIds)) aiTriggerConfig.playIds = p.playIds;
        // 音乐停止后关闭播放（默认 false，避免老用户数据里没有导致未定义）

  // 换控台连接/重新加载节目列表后：过滤掉"当前控台不存在"的 playId，防止旧控台勾选的 ID 带到新控台
  // 过滤完成后：写回 localStorage 并立即推送给主窗口 AiTrigger.config
  window.normalizeAiTriggerAfterPlaylistLoad = function normalizeAiTriggerAfterPlaylistLoad() {
    try {
      if (!Array.isArray(playlists) || playlists.length === 0) return;
      // 收集当前控台所有真实 playId（字符串化，统一比较）
      const realSet = new Set();
      playlists.forEach(function(pl) {
        const items = (pl && (pl.playItemList || pl.items)) || [];
        items.forEach(function(pi) { if (pi && pi.playId !== undefined && pi.playId !== null) realSet.add(String(pi.playId)); });
      });
      if (realSet.size === 0) return;
      const before = Array.isArray(aiTriggerConfig.playIds) ? aiTriggerConfig.playIds.slice() : [];
      const after = before.filter(function(pid) { return realSet.has(String(pid)); });
      // 标记是否变化：长度变 或 元素不同（顺序不影响）
      let changed = (after.length !== before.length);
      if (!changed) {
        const bs = new Set(before.map(String));
        for (let i = 0; i < after.length; i++) { if (!bs.has(String(after[i]))) { changed = true; break; } }
      }
      aiTriggerConfig.playIds = after;
      try {
        localStorage.setItem('aiTriggerConfig', JSON.stringify({
          switchMode: aiTriggerConfig.switchMode,
          playIds: aiTriggerConfig.playIds,
          stopScenesOnMusicStop: aiTriggerConfig.stopScenesOnMusicStop
        }));
      } catch(_) {}
      // 推送给主窗口（主窗口 AiTrigger.setConfig 会立即应用新 playIds 池）
      try { ipcRenderer.send('ai-trigger-config', aiTriggerConfig); } catch(_) {}
      if (changed) {
        try { console.log('[AI触发] 换控台后归一 playIds：旧=' + JSON.stringify(before) + ' 新=' + JSON.stringify(after)); } catch(_) {}
      }
    } catch(_) {}
  };

  window.openAiTriggerModal = function openAiTriggerModal() {

        '</select>' +

    }
    if (groupBar) {
      groupBar.addEventListener('click', function(e) {
        const btn = e.target.closest('[data-groupselect]');
        if (btn) { e.preventDefault(); groupToggle(btn.getAttribute('data-groupselect')); }
      });
    }
    if (poolEl) {
      poolEl.addEventListener('click', function(e) {
        // 分组内全选本组按钮
        const btn = e.target.closest('[data-groupselect]');
        if (btn) { e.preventDefault(); groupToggle(btn.getAttribute('data-groupselect')); return; }
        // 折叠分组（点标题栏）
        const hdr = e.target.closest('[data-group]');
        if (hdr && hdr.id && !e.target.closest('[data-groupselect]')) {
          const gid = hdr.id.replace(/Hdr$/, 'Body');
          const body = document.getElementById(gid);
          if (body) {
            body.style.display = (body.style.display === 'none') ? '' : 'none';
            const arrow = hdr.querySelector('span');
            if (arrow) arrow.textContent = (body.style.display === 'none' ? '▶ ' : '▼ ') + hdr.getAttribute('data-group');
          }
        }
        // 单个 checkbox 点选 → 同步 selectedSet（支持 Shift 区间 / Ctrl 增删）
        const cb = e.target.closest('.at-pool-cb');
        if (cb) {
          const allCbs = Array.from(poolEl.querySelectorAll('.at-pool-cb'));
          const idx = allCbs.indexOf(cb);
          const isShift = e.shiftKey;
          const isCtrl = e.ctrlKey || e.metaKey;

          if (isShift && mask._lastCbIndex >= 0 && idx >= 0) {
            // Shift + 点击：把 lastIndex <-> 当前索引区间内的 checkbox
            // 统一设为「当前 cb.checked 的值」（默认全选，因为 checkbox 已翻转过（因为用户这次点了 cb，浏览器会翻转，我们在区间内按"取 cb.checked 前的值 还是 后的值"？
            // 最符合直觉：区间内全部置为 = cb.checked（即，与最后这次点击的最终状态一致）
            const targetVal = cb.checked;
            const lo = Math.min(mask._lastCbIndex, idx);
            const hi = Math.max(mask._lastCbIndex, idx);
            for (let i = lo; i <= hi; i++) {
              const c = allCbs[i];
              if (!c) continue;
              c.checked = targetVal;
              if (targetVal) selectedSet.add(c.value);
              else selectedSet.delete(c.value);
            }
            mask._lastCbIndex = idx;
            renderPool(searchEl ? searchEl.value : '');
            return;
          }

          // 普通点击：更新集合，记录最后一次 index
          if (cb.checked) selectedSet.add(cb.value);
          else selectedSet.delete(cb.value);
          if (!isCtrl) mask._lastCbIndex = idx;  // Ctrl 点不改变区间锚点
          updateCount();
        }
      });
    }

    // 初始化渲染
    renderPool('');

    // 保存 aiTriggerConfig.playIds 引用（saveAiTriggerModal 从 selectedSet 读取）
    mask._atSelectedSet = selectedSet;

    // 键盘：回车确定（搜索框按回车不触发确定：除非焦点在确定按钮或回车在非textarea/input场景）
    function _atKey(e) {
      if (e.key === 'Enter') {
        // 搜索框回车 → 不关闭弹窗，只搜索
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) {
          return;
        }
        e.preventDefault(); saveAiTriggerModal();
      } else if (e.key === 'Escape') { e.preventDefault(); closeAiTriggerModal(); }
    }
    document.addEventListener('keydown', _atKey);
    mask._atKey = _atKey;
  }

  window.saveAiTriggerModal = function saveAiTriggerModal() {
    const mask = document.getElementById('aiTriggerMask');
    if (!mask) return;
    const sel = mask.querySelector('#atSwitchMode');
    if (sel) aiTriggerConfig.switchMode = sel.value;
    const stopCb = mask.querySelector('#atStopScenesOnMusicStop');
    if (stopCb) aiTriggerConfig.stopScenesOnMusicStop = !!stopCb.checked;
    // 从 selectedSet 读取（包含折叠分组里的勾选项，比 querySelectorAll 更准）
    if (mask._atSelectedSet) {
      aiTriggerConfig.playIds = Array.from(mask._atSelectedSet);
    } else {
      const checks = mask.querySelectorAll('#atPool input[type=checkbox]:checked');
      aiTriggerConfig.playIds = Array.from(checks).map(c => c.value);
    }
    try { localStorage.setItem('aiTriggerConfig', JSON.stringify({ switchMode: aiTriggerConfig.switchMode, playIds: aiTriggerConfig.playIds, stopScenesOnMusicStop: aiTriggerConfig.stopScenesOnMusicStop })); } catch(_) {}
    closeAiTriggerModal();
    // 同步配置到主窗口
    try { ipcRenderer.send('ai-trigger-config', aiTriggerConfig); } catch(_) {}
  }

  window.closeAiTriggerModal = function closeAiTriggerModal() {
    const mask = document.getElementById('aiTriggerMask');
    if (mask) {
      if (mask._atKey) document.removeEventListener('keydown', mask._atKey);
      mask.remove();
    }
  }

  // 初始化：加载配置 + 恢复开关状态（记忆最后状态）
  try {
    loadAiTriggerConfig();
    const _atToggle = document.getElementById('aiTriggerToggle');
    if (_atToggle) {
      _atToggle.checked = aiTriggerConfig.enabled;
      _atToggle.addEventListener('change', onAiTriggerToggle);
    }
    updateAiTriggerUI(aiTriggerConfig.enabled);
    // 同步配置到主窗口（延迟，等主窗口就绪）
    setTimeout(function() { try { ipcRenderer.send('ai-trigger-config', aiTriggerConfig); } catch(_) {} }, 1000);
  } catch(_) {}
  // ========== AI触发功能 END ==========

  // ========== 新功能数据收集/恢复（被主进程转发调用，用于主窗口项目保存/加载） ==========
  // 收集控台 localStorage 数据（主窗口保存项目时调用，主进程转发过来）
  try {
    ipcRenderer.on('console-collect-features', function() {
      var out = null;
      try {
        var keys = [
          'consoleShortcuts', 'consoleMusicBinds', 'consoleSceneMutex',
          'consoleProtectedPlayIds', 'consoleMusicSyncEnabled',
          'consoleShortcutEnabled', 'consoleConnectIp',
          'consoleGroupOrder', 'consoleGroupCollapsed'
        ];
        out = {};
        keys.forEach(function(k){
          try { out[k] = localStorage.getItem(k); } catch(_) { out[k] = null; }
        });
      } catch(_) { out = null; }
      try { ipcRenderer.send('console-features-collected', out); } catch(_) {}
    });
  } catch(_) {}

  // 恢复控台 localStorage 数据（主窗口加载项目时调用，主进程转发过来）
  try {
    ipcRenderer.on('console-restore-features', function(event, data) {
      try {
        if (data && typeof data === 'object') {
          Object.keys(data).forEach(function(k){
            try {
              var v = data[k];
              if (v === null || v === undefined) return;
              localStorage.setItem(k, String(v));
            } catch(_) {}
          });
          // 刷新页面以应用恢复的设置（控台初始化逻辑较多，刷新最稳妥）
          setTimeout(function(){ try { location.reload(); } catch(_) {} }, 100);
        }
      } catch(_) {}
    });
  } catch(_) {}

    } catch(bootErr) {
      // =============== 启动致命错误：直接写顶层红条，任何函数（toast/showProtoNotice）都不能依赖 ===============
      try {
        var errText = (bootErr && (bootErr.stack || bootErr.message) || String(bootErr) || '未知错误').toString().slice(0, 1200);
        var banner = document.createElement('div');
        banner.style.cssText = 'position:sticky;top:0;z-index:99999;padding:12px 18px;font-size:13px;font-weight:700;color:#7f1d1d;background:#fee2e2;border-bottom:2px solid #fca5a5;white-space:pre-wrap;word-break:break-all;';
        banner.textContent = '⚠️ 连接控台脚本启动失败（渲染覆写/初始化阶段）。请关掉窗口后重新打开一次。\n错误详情：' + errText;
        try {
          if (document.body && document.body.firstChild) document.body.insertBefore(banner, document.body.firstChild);
          else if (document.body) document.body.appendChild(banner);
          else document.documentElement.appendChild(banner);
        } catch(_2) {}
        try {
          var pill = document.getElementById('connStatus');
          if(pill) pill.textContent = '脚本启动失败：' + (bootErr && bootErr.message || String(bootErr)).slice(0, 120);
        } catch(_4) {}
      } catch(_fatal) {
        try { alert('连接控台脚本启动失败：' + (bootErr && bootErr.message || String(bootErr))); } catch(_g) {}
      }
    }
  })();

  // ============ 脚本加载完成确认 + 函数可用性自检 ============
  try {
    var _fns = ['doConnect','doDisconnect','doQueryPlaylists','doForceReloginAndQuery','openShortcutModal','sendCtrl','setConnState','renderPlaylists'];
    var _missing = _fns.filter(function(n){ return typeof window[n] !== 'function'; });
    if (_missing.length > 0) {
      var b = document.createElement('div');
      b.style.cssText = 'position:sticky;top:0;z-index:99999;padding:10px 14px;font-size:13px;font-weight:700;color:#7f1d1d;background:#fee2e2;border-bottom:2px solid #fca5a5;white-space:pre-wrap;word-break:break-all;';
      b.textContent = '⚠️ 脚本加载完成但以下函数未挂到 window：' + _missing.join(', ') + '\n请关掉窗口重新打开。';
      if(document.body) document.body.insertBefore(b, document.body.firstChild);
    }
    console.log('[ConsoleConnect] script loaded OK, functions check:', _missing.length === 0 ? 'ALL OK' : ('MISSING: ' + _missing.join(',')));
  } catch(_) {}
</script>
